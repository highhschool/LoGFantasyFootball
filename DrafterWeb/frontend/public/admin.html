<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGFL Drafter — sessions</title>
<style>
  :root {
    --ground: #f4f7f5; --surface: #fff; --raised: #eaf0ec; --ink: #16201c;
    --ink-2: #566159; --ink-3: #7c8781; --rule: #dbe3dd; --accent: #1c6b48;
    --danger: #9b2c2c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0e1412; --surface: #151d1a; --raised: #1c2622; --ink: #e7ede9;
      --ink-2: #9daaa3; --ink-3: #75837c; --rule: #25302b; --accent: #6cc095;
      --danger: #e08585;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 1.5rem; background: var(--ground); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }
  .sub { margin: 0.25rem 0 0; color: var(--ink-2); font-size: 0.9rem; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  button {
    font: inherit; font-size: 0.85rem; padding: 0.35rem 0.7rem; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--raised); color: var(--ink);
    cursor: pointer; min-height: 34px;
  }
  button[aria-pressed="true"] { background: var(--accent); color: var(--ground); border-color: transparent; }
  .wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { background: var(--raised); color: var(--ink-3); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--raised); }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .muted { color: var(--ink-3); }
  .err { color: var(--danger); }
  details { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
  summary { padding: 0.6rem 0.9rem; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  /* A panel is a whole section that folds away, so its own summary carries
     the heading and the counts -- collapsed, the count is all you need. */
  details.panel { background: transparent; border: 0; }
  details.panel > summary {
    padding: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 0.7rem; list-style: none;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  /* Drawn from two borders rather than set as a character: a triangle
     glyph renders differently on every platform, arrives as an emoji on
     some, and needs an escape that has already been mangled once. This
     is the same chevron everywhere, and it turns as the panel opens. */
  details.panel > summary::before {
    content: ""; flex: none; width: 0.38em; height: 0.38em;
    margin-left: 0.15em; margin-top: -0.16em;
    border-right: 2px solid var(--ink-3);
    border-bottom: 2px solid var(--ink-3);
    border-radius: 1px; transform: rotate(-45deg);
    transition: transform 150ms ease, border-color 150ms ease;
  }
  details.panel[open] > summary::before {
    transform: rotate(45deg); margin-top: -0.2em;
  }
  details.panel > summary:hover::before {
    border-right-color: var(--ink); border-bottom-color: var(--ink);
  }
  details.panel > summary .count {
    font-size: 0.85rem; font-weight: 400; color: var(--ink-3);
    letter-spacing: 0; margin-left: auto;
  }
  details.panel > .body { display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem; }
  input[type="search"], select {
    font: inherit; font-size: 0.85rem; padding: 0.35rem 0.6rem; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
    min-height: 34px;
  }
  input[type="search"] { min-width: 15rem; flex: 1 1 15rem; }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--ink); }
  /* Same chevron as the panels, for the same reason. Held at zero
     opacity when unsorted so the header does not jump on a click. */
  th[data-sort]::after {
    content: ""; display: inline-block; width: 0.32em; height: 0.32em;
    margin-left: 0.45em; vertical-align: 0.12em; opacity: 0;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
  }
  th[data-sort][data-dir="asc"]::after {
    opacity: 0.8; transform: rotate(-135deg); vertical-align: 0.02em;
  }
  th[data-sort][data-dir="desc"]::after { opacity: 0.8; }
  .more { align-self: flex-start; }
  .note { margin: 0; font-size: 0.8rem; color: var(--ink-3); }
  .board { padding: 0 0.9rem 0.9rem; overflow-x: auto; }
  .board table { font-size: 0.78rem; }
  .board td, .board th { white-space: nowrap; padding: 0.3rem 0.5rem; }
  .codes-col { display: none; }
  body.show-codes .codes-col { display: table-cell; }
  code { font-family: ui-monospace, Consolas, monospace; letter-spacing: 0.08em; }
  .pending { color: var(--ink-3); font-style: italic; }
  .pill {
    display: inline-block; padding: 0.1rem 0.45rem; border-radius: 999px;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid currentColor;
  }
  .pill.bad { color: var(--danger); }
  .pill.warn { color: var(--warn, #a86a1a); }
  .pill.good { color: var(--accent); }
  .pill.idle { color: var(--ink-3); }
  @media (prefers-color-scheme: dark) { .pill.warn { color: #e0b062; } }
  .steps { margin: 0; padding-left: 1.1rem; font-size: 0.85rem; color: var(--ink-2); }
  .steps li { margin: 0.15rem 0; }
  .steps code { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <p class="sub" id="who">Checking access…</p>

  <details class="panel" id="panel-sessions" open>
    <summary>Sessions <span class="count" id="summary"></span></summary>
    <div class="body">
      <div class="bar">
        <button data-mode="" aria-pressed="true">All</button>
        <button data-mode="mock" aria-pressed="false">Mock drafts</button>
        <button data-mode="assistant" aria-pressed="false">Live drafts</button>
        <input type="search" id="q" placeholder="Search name, owner, or id" autocomplete="off">
        <select id="f-status" aria-label="Progress">
          <option value="">Any progress</option>
          <option value="complete">Complete</option>
          <option value="partial">In progress</option>
          <option value="empty">Not started</option>
        </select>
        <select id="f-owner" aria-label="Owner">
          <option value="">Any owner</option>
        </select>
        <button id="reset">Clear</button>
      </div>

      <div class="wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="name">Name</th><th>Tool</th><th data-sort="owner">Owner</th>
              <th class="num" data-sort="picks_made">Picks</th><th class="num">Teams</th>
              <th class="num">Slot</th><th class="num">Keepers</th>
              <th data-sort="updated_at" data-dir="desc">Updated</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"><tr><td colspan="9" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>

      <button class="more" id="more" hidden></button>
      <p class="note" id="truncated" hidden></p>
      <div id="detail"></div>
    </div>
  </details>

  <hr style="border:0;border-top:1px solid var(--rule);margin:0.5rem 0">

  <details class="panel" id="panel-contracts">
    <summary>Contracts <span class="count" id="contracts-summary"></span></summary>
    <div class="body">
      <p class="sub" id="contracts-risk" style="margin:0">Loading…</p>

      <div class="bar">
        <button id="new-slate">New draft slate</button>
        <button id="settle">Settle what the draft has answered</button>
        <button id="refresh-contracts">Refresh</button>
      </div>

      <div id="slate-form" hidden></div>

      <div class="wrap">
        <table>
          <thead>
            <tr>
              <th>Market</th><th class="num">Yes</th><th class="num">Traded</th>
              <th class="num">If yes</th><th class="num">If no</th>
              <th>Closes</th><th>Outcome</th><th></th>
            </tr>
          </thead>
          <tbody id="contract-rows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>

      <div id="ledger"></div>
    </div>
  </details>

  <hr style="border:0;border-top:1px solid var(--rule);margin:0.5rem 0">

  <details class="panel" id="panel-keepers" open>
    <summary>Keepers <span class="count" id="keeper-summary"></span></summary>
    <div class="body">
      <p class="sub" id="keeper-status" style="margin:0">Loading…</p>

      <div class="bar">
        <button id="sync">Sync league from Sleeper</button>
        <button id="toggle-codes" aria-pressed="false">Show codes</button>
        <button id="verify">Check against Sleeper</button>
        <button id="toggle-entry" aria-pressed="false">Entry list</button>
      </div>

      <div id="entry-list" hidden></div>
      <div id="verify-out"></div>

      <div class="wrap">
        <table>
          <thead>
            <tr>
              <th class="num">Slot</th><th>Manager</th><th>Team</th>
              <th class="codes-col">Code</th>
              <th>Keeper</th><th class="num">ADP</th><th class="num">Round</th>
              <th>Chosen</th>
            </tr>
          </thead>
          <tbody id="keeper-rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </details>
</main>

<script>
  // Everything is fetched once and filtered here. The listing is capped at a
  // thousand rows server-side, which is far more than this league will make,
  // and filtering in the page keeps every control instant and the owner list
  // complete rather than dependent on whichever tab is selected.
  const PAGE = 50;

  let all = [];
  let mode = "";
  let shown = PAGE;
  let sort = { key: "updated_at", dir: "desc" };

  const fmt = (iso) => {
    try { return new Date(iso).toLocaleString(); } catch { return iso; }
  };

  const progress = (s) =>
    s.picks_made === 0 ? "empty"
      : s.picks_made >= s.teams * s.rounds ? "complete"
        : "partial";

  function filtered() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const status = document.getElementById("f-status").value;
    const owner = document.getElementById("f-owner").value;

    let out = all.filter((s) => {
      if (mode && s.mode !== mode) return false;
      if (owner && s.owner !== owner) return false;
      if (status && progress(s) !== status) return false;
      if (q && !`${s.name} ${s.owner} ${s.id}`.toLowerCase().includes(q)) return false;
      return true;
    });

    const { key, dir } = sort;
    out.sort((a, b) => {
      const x = a[key] ?? "", y = b[key] ?? "";
      const cmp = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
      return dir === "asc" ? cmp : -cmp;
    });
    return out;
  }

  function render() {
    const rows = document.getElementById("rows");
    const matches = filtered();
    const page = matches.slice(0, shown);

    document.getElementById("summary").textContent =
      matches.length === all.length
        ? `${all.length} session${all.length === 1 ? "" : "s"}`
        : `${matches.length} of ${all.length}`;

    const more = document.getElementById("more");
    more.hidden = matches.length <= page.length;
    more.textContent = `Show ${Math.min(PAGE, matches.length - page.length)} more` +
      ` (${matches.length - page.length} hidden)`;

    if (!page.length) {
      rows.innerHTML = `<tr><td colspan="9" class="muted">${
        all.length ? "Nothing matches those filters." : "Nothing yet."
      }</td></tr>`;
      return;
    }

    rows.innerHTML = page.map((s) => `
      <tr>
        <td>${escape(s.name || s.id)}</td>
        <td class="muted">${s.mode === "mock" ? "mock" : "live"}</td>
        <td class="muted">${escape(s.owner)}</td>
        <td class="num">${s.picks_made}</td>
        <td class="num">${s.teams}</td>
        <td class="num">${s.your_slot}</td>
        <td class="num">${s.keepers || ""}</td>
        <td class="muted">${fmt(s.updated_at)}</td>
        <td><button data-open="${s.id}">Board</button></td>
      </tr>`).join("");
  }

  async function load() {
    const rows = document.getElementById("rows");
    try {
      const res = await fetch("/api/admin/sessions?limit=1000");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      all = data.sessions;

      // A listing that quietly stops at the limit looks like the whole set.
      const note = document.getElementById("truncated");
      note.hidden = !(data.total > data.count);
      note.textContent = `Showing the ${data.count} most recent of ${data.total}.`;

      const owners = [...new Set(all.map((s) => s.owner))].sort();
      const select = document.getElementById("f-owner");
      const keep = select.value;
      select.innerHTML = '<option value="">Any owner</option>' +
        owners.map((o) => `<option value="${escape(o)}">${escape(o)}</option>`).join("");
      select.value = owners.includes(keep) ? keep : "";

      render();
    } catch (e) {
      rows.innerHTML = `<tr><td colspan="9" class="err">Could not load: ${escape(String(e))}</td></tr>`;
    }
  }

  async function openBoard(id) {
    const target = document.getElementById("detail");
    target.innerHTML = '<p class="muted">Loading board…</p>';
    try {
      const res = await fetch(`/api/admin/sessions/${id}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const d = await res.json();

      const slots = Object.keys(d.rosters).map(Number).sort((a, b) => a - b);
      const head = slots.map((s) =>
        `<th>${s === d.config.your_slot ? "Slot " + s + " (theirs)" : "Slot " + s}</th>`).join("");

      const rounds = [];
      for (let r = 1; r <= d.config.rounds; r++) {
        const cells = slots.map((s) => {
          const pick = (d.rosters[s] || []).find((p) => p.round === r);
          return `<td>${pick ? escape(pick.position + " " + pick.player_name) : ""}</td>`;
        }).join("");
        rounds.push(`<tr><td class="muted">${r}</td>${cells}</tr>`);
      }

      target.innerHTML = `
        <details open>
          <summary>${escape(d.name || d.id)} — ${d.picks.length} picks${d.complete ? ", complete" : ""}</summary>
          <div class="board">
            <table>
              <thead><tr><th>Rd</th>${head}</tr></thead>
              <tbody>${rounds.join("")}</tbody>
            </table>
          </div>
        </details>`;
      target.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      target.innerHTML = `<p class="err">Could not load board: ${escape(String(e))}</p>`;
    }
  }

  function escape(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Any filter changing resets the page: paging into rows that no longer
  // match is the fastest way to make a list look broken.
  function refilter() {
    shown = PAGE;
    render();
  }

  document.getElementById("q").addEventListener("input", refilter);
  document.getElementById("f-status").addEventListener("change", refilter);
  document.getElementById("f-owner").addEventListener("change", refilter);

  document.getElementById("more").addEventListener("click", () => {
    shown += PAGE;
    render();
  });

  document.getElementById("reset").addEventListener("click", () => {
    document.getElementById("q").value = "";
    document.getElementById("f-status").value = "";
    document.getElementById("f-owner").value = "";
    mode = "";
    document.querySelectorAll("[data-mode]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.mode === "")));
    refilter();
  });

  const flip = (dir) => (dir === "asc" ? "desc" : "asc");

  document.querySelectorAll("th[data-sort]").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      // Text reads best A-Z first; counts and dates read best largest first.
      const fresh = key === "name" || key === "owner" ? "asc" : "desc";
      sort = { key, dir: sort.key === key && sort.dir === fresh ? flip(fresh) : fresh };
      document.querySelectorAll("th[data-sort]").forEach((o) => delete o.dataset.dir);
      th.dataset.dir = sort.dir;
      render();
    });
  });

  // The panels remember whether they were folded, since this page is opened
  // again and again and usually for one of its two halves.
  document.querySelectorAll("details.panel").forEach((panel) => {
    try {
      const saved = localStorage.getItem(`ngfl:${panel.id}`);
      if (saved !== null) panel.open = saved === "1";
    } catch {}
    panel.addEventListener("toggle", () => {
      try { localStorage.setItem(`ngfl:${panel.id}`, panel.open ? "1" : "0"); } catch {}
    });
  });

  document.addEventListener("click", (e) => {
    const tab = e.target.closest("[data-mode]");
    if (tab) {
      mode = tab.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach((b) =>
        b.setAttribute("aria-pressed", String(b === tab)));
      refilter();
    }
    const open = e.target.closest("[data-open]");
    if (open) openBoard(open.dataset.open);
  });

  fetch("/api/admin/whoami")
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
    .then((d) => {
      document.getElementById("who").textContent = `Signed in as ${d.admin}. Read-only.`;
    })
    .catch(() => {
      document.getElementById("who").innerHTML =
        '<span class="err">Not recognised as the site owner.</span> ' +
        'Check the Cloudflare Access policy covers /admin and /api/admin, and that ' +
        'ADMIN_EMAILS lists your address.';
    });

  load();

  // ---------------------------------------------------------------- keepers

  let codesByUser = {};

  function countdown(iso) {
    if (!iso) return "no deadline set";
    const left = new Date(iso) - new Date();
    if (left <= 0) return "closed";
    const h = Math.floor(left / 3600000);
    const d = Math.floor(h / 24);
    return d >= 1 ? `${d}d ${h % 24}h left` : `${h}h left`;
  }

  async function loadKeepers() {
    const rows = document.getElementById("keeper-rows");
    try {
      const [board, codes] = await Promise.all([
        fetch("/api/admin/keepers").then((r) => r.json()),
        fetch("/api/admin/keepers/codes").then((r) => r.json()),
      ]);

      codesByUser = {};
      (codes.managers || []).forEach((m) => { codesByUser[m.user_id] = m; });

      document.getElementById("keeper-status").textContent =
        board.deadline
          ? `Deadline ${new Date(board.deadline).toLocaleString()} — ${countdown(board.deadline)}`
          : "No deadline set.";
      document.getElementById("keeper-summary").textContent =
        `${board.chosen} of ${board.total} chosen`;

      if (!board.keepers.length) {
        rows.innerHTML = '<tr><td colspan="8" class="muted">No managers yet — sync the league.</td></tr>';
        return;
      }

      rows.innerHTML = board.keepers.map((k) => {
        const m = codesByUser[k.user_id] || {};
        const claimed = m.claimed ? "yes" : "not yet";
        return `
        <tr>
          <td class="num">${k.draft_slot ?? "—"}</td>
          <td>${escape(k.display_name || "—")}</td>
          <td class="muted">${escape(k.team_name || "")}</td>
          <td class="codes-col"><code>${escape(m.code || "")}</code> <span class="muted">${claimed}</span></td>
          <td>${k.player_name
            ? escape(k.position + " " + k.player_name + " (" + k.nfl_team + ")")
            : '<span class="pending">not chosen</span>'}</td>
          <td class="num">${k.adp != null ? k.adp.toFixed(1) : ""}</td>
          <td class="num">${k.round ?? ""}</td>
          <td class="muted">${k.updated_at ? fmt(k.updated_at) : ""}</td>
        </tr>`;
      }).join("");
    } catch (e) {
      rows.innerHTML = `<tr><td colspan="8" class="err">Could not load: ${escape(String(e))}</td></tr>`;
    }
  }

  document.getElementById("sync").addEventListener("click", async (e) => {
    e.target.disabled = true;
    e.target.textContent = "Syncing…";
    try {
      const r = await fetch("/api/admin/keepers/sync", { method: "POST" });
      const d = await r.json();
      // A departed manager being dropped is the part worth seeing: it takes
      // their code and their selection with it.
      const churn = [
        d.added ? `${d.added} new` : "",
        d.removed ? `${d.removed} gone` : "",
      ].filter(Boolean).join(", ");
      e.target.textContent = r.ok
        ? `Synced ${d.managers}${churn ? ` (${churn})` : ""}`
        : `Failed: ${d.detail || r.status}`;
      await loadKeepers();
    } catch (err) {
      e.target.textContent = `Failed: ${err}`;
    } finally {
      setTimeout(() => {
        e.target.disabled = false;
        e.target.textContent = "Sync league from Sleeper";
      }, 2500);
    }
  });

  // ------------------------------------------------------------ contracts

  const money = (c) => (c < 0 ? "-" : "") + "$" + (Math.abs(c) / 100).toFixed(2);
  const when = (iso) => {
    try {
      return new Date(iso).toLocaleString(undefined, {
        weekday: "short", hour: "numeric", minute: "2-digit",
      });
    } catch { return iso; }
  };

  async function loadContracts() {
    const rows = document.getElementById("contract-rows");
    try {
      const d = await fetch("/api/admin/contracts").then((r) => r.json());

      document.getElementById("contracts-summary").textContent =
        `${d.markets.length} market${d.markets.length === 1 ? "" : "s"}`;

      // The number to watch on the night: what is actually on the line, not
      // what was budgeted when the markets opened.
      const worst = Math.min(d.house_if_all_yes, d.house_if_all_no);
      document.getElementById("contracts-risk").innerHTML = d.markets.length
        ? `Worst case from here: <strong class="${worst < 0 ? "err" : ""}">${money(worst)}</strong>` +
          ` · budgeted ${money(-d.budgeted_exposure)} across ${d.markets.length}` +
          ` · ${d.slates.length} slate${d.slates.length === 1 ? "" : "s"}`
        : "No markets yet.";

      if (!d.markets.length) {
        rows.innerHTML = '<tr><td colspan="7" class="muted">Open a slate, then add markets.</td></tr>';
        return;
      }

      rows.innerHTML = d.markets.map((m) => `
        <tr>
          <td>${escape(m.question)}</td>
          <td class="num">${m.price_yes}&cent;</td>
          <td class="num">${m.traded}</td>
          <td class="num ${m.house_if_yes < 0 ? "err" : ""}">${money(m.house_if_yes)}</td>
          <td class="num ${m.house_if_no < 0 ? "err" : ""}">${money(m.house_if_no)}</td>
          <td class="muted">${escape(when(m.closes_at))}</td>
          <td>${m.resolved === null
            ? '<span class="pill idle">open</span>'
            : `<span class="pill ${m.resolved ? "good" : "bad"}">${m.resolved ? "yes" : "no"}</span>`}</td>
          <td>${m.traded === 0 && m.resolved === null
            ? `<button data-drop="${m.market_id}">Remove</button>` : ""}</td>
        </tr>`).join("");

      await loadLedger();
    } catch (e) {
      rows.innerHTML = `<tr><td colspan="7" class="err">Could not load: ${escape(String(e))}</td></tr>`;
    }
  }

  async function loadLedger() {
    const box = document.getElementById("ledger");
    const d = await fetch("/api/admin/contracts/ledger").then((r) => r.json());
    if (!d.settled_markets) { box.innerHTML = ""; return; }

    box.innerHTML = `
      <p class="sub" style="margin:0.8rem 0 0.4rem">
        After ${d.settled_markets} settled: you are
        <strong class="${d.house < 0 ? "err" : ""}">${money(d.house)}</strong>
      </p>
      <div class="wrap"><table>
        <thead><tr><th>Manager</th><th class="num">Owes you</th></tr></thead>
        <tbody>${d.managers.map((m) => `
          <tr><td>${escape(m.manager)}</td>
          <td class="num ${m.net > 0 ? "" : "err"}">${money(-m.net)}</td></tr>`).join("")}
        </tbody>
      </table></div>`;
  }

  document.getElementById("new-slate").addEventListener("click", () => {
    const box = document.getElementById("slate-form");
    box.hidden = !box.hidden;
    if (box.hidden) return;
    box.innerHTML = `
      <div class="bar">
        <input type="search" id="slate-name" placeholder="Slate name" value="Draft night">
        <input type="search" id="slate-start" placeholder="2026-09-01T18:30:00-05:00"
               value="2026-09-01T18:30:00-05:00">
        <button id="save-slate">Open it</button>
      </div>
      <p class="note">Opens on the Tuesday 9am before that time, and closes when the draft starts.</p>`;

    document.getElementById("save-slate").addEventListener("click", async (e) => {
      e.target.disabled = true;
      const r = await fetch("/api/admin/contracts/slates", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("slate-name").value,
          kind: "draft",
          draft_start: document.getElementById("slate-start").value,
        }),
      });
      const d = await r.json();
      e.target.textContent = r.ok
        ? `Opens ${when(d.slate.opens_at)}`
        : `Failed: ${d.detail || r.status}`;
      if (r.ok) await loadContracts();
      setTimeout(() => { e.target.disabled = false; e.target.textContent = "Open it"; }, 3000);
    });
  });

  document.getElementById("settle").addEventListener("click", async (e) => {
    e.target.disabled = true;
    e.target.textContent = "Settling…";
    try {
      const d = await fetch("/api/admin/contracts/resolve", { method: "POST" })
        .then((r) => r.json());
      e.target.textContent = d.settled?.length
        ? `Settled ${d.settled.length}` + (d.waiting.length ? `, ${d.waiting.length} waiting` : "")
        : `Nothing answerable yet` + (d.waiting?.length ? ` (${d.waiting.length} waiting)` : "");
      await loadContracts();
    } catch (err) {
      e.target.textContent = `Failed: ${err}`;
    } finally {
      setTimeout(() => {
        e.target.disabled = false;
        e.target.textContent = "Settle what the draft has answered";
      }, 3000);
    }
  });

  // Only offered while a market is untraded: after that it is somebody's
  // position and removing it would take real money off the board.
  document.addEventListener("click", async (e) => {
    const drop = e.target.closest("[data-drop]");
    if (!drop) return;
    drop.disabled = true;
    const r = await fetch(`/api/admin/contracts/markets/${drop.dataset.drop}`,
                          { method: "DELETE" });
    if (r.ok) return loadContracts();
    drop.textContent = `Failed: ${(await r.json()).detail || r.status}`;
  });

  document.getElementById("refresh-contracts").addEventListener("click", loadContracts);
  loadContracts();

  // -------------------------------------------------- Sleeper cross-check

  // Sleeper's API cannot be written to, so these twelve rows get typed into
  // its commissioner UI by hand once a year. It does publish assigned keepers
  // before the draft starts, which is what makes the mistakes findable while
  // there is still time to fix them.
  const PILL = {
    mismatch:    ["bad",  "wrong player"],
    wrong_round: ["bad",  "wrong round"],
    missing:     ["warn", "not entered"],
    unexpected:  ["warn", "not chosen here"],
    match:       ["good", "agrees"],
    pending:     ["idle", "no keeper yet"],
  };

  const side = (name, round) =>
    name ? `${escape(name)} <span class="muted">R${round}</span>` : '<span class="pending">—</span>';

  document.getElementById("verify").addEventListener("click", async (e) => {
    const out = document.getElementById("verify-out");
    e.target.disabled = true;
    e.target.textContent = "Checking…";
    out.innerHTML = '<p class="muted">Reading the Sleeper draft board…</p>';
    try {
      const r = await fetch("/api/admin/keepers/verify");
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);

      const headline = d.needs_action
        ? `<span class="err">${d.needs_action} to fix</span> · ${d.agreed} agree`
        : `<span>All ${d.agreed} agree with Sleeper.</span>`;

      out.innerHTML = `
        <p class="sub" style="margin:0 0 0.6rem">
          ${headline} · draft ${escape(d.draft_status)}
        </p>
        <div class="wrap">
          <table>
            <thead><tr>
              <th class="num">Slot</th><th>Manager</th><th></th>
              <th>Chosen here</th><th>In Sleeper</th>
            </tr></thead>
            <tbody>${d.rows.map((row) => {
              const [tone, label] = PILL[row.status] || ["idle", row.status];
              return `<tr>
                <td class="num">${row.draft_slot ?? "—"}</td>
                <td>${escape(row.manager || "—")}</td>
                <td><span class="pill ${tone}">${label}</span></td>
                <td>${side(row.ours_name, row.ours_round)}</td>
                <td>${side(row.theirs_name, row.theirs_round)}</td>
              </tr>`;
            }).join("")}</tbody>
          </table>
        </div>`;
      e.target.textContent = d.needs_action ? `${d.needs_action} to fix` : "All agree";
    } catch (err) {
      out.innerHTML = `<p class="err">Could not check: ${escape(String(err.message || err))}</p>`;
      e.target.textContent = "Failed";
    } finally {
      setTimeout(() => {
        e.target.disabled = false;
        e.target.textContent = "Check against Sleeper";
      }, 3000);
    }
  });

  // The list to work down while typing them into Sleeper: draft order, slot
  // and round together, so nothing has to be cross-referenced mid-entry.
  document.getElementById("toggle-entry").addEventListener("click", async (e) => {
    const box = document.getElementById("entry-list");
    const showing = e.target.getAttribute("aria-pressed") === "true";
    e.target.setAttribute("aria-pressed", String(!showing));
    box.hidden = showing;
    if (showing) return;

    const chosen = (await fetch("/api/keeper/import").then((r) => r.json())).keepers;
    box.innerHTML = chosen.length
      ? `<ol class="steps">${chosen.map((k) =>
          `<li>Slot <code>${k.draft_slot ?? k.team_slot}</code> ${escape(k.manager)} — ` +
          `<code>${escape(k.player_name)}</code> in round <code>${k.round}</code></li>`
        ).join("")}</ol>`
      : '<p class="muted">Nobody has chosen a keeper yet.</p>';
  });

  document.getElementById("toggle-codes").addEventListener("click", (e) => {
    const on = document.body.classList.toggle("show-codes");
    e.target.setAttribute("aria-pressed", String(on));
    e.target.textContent = on ? "Hide codes" : "Show codes";
  });

  loadKeepers();
</script>
</body>
</html>
