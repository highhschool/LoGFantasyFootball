services:
  api:
    build:
      # Root context so the image can build the frontend and the API together.
      context: .
      dockerfile: backend/Dockerfile
    container_name: ngfl-drafter-api
    restart: unless-stopped
    environment:
      SEASON: "${SEASON:-2026}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SLEEPER_LEAGUE_ID: "${SLEEPER_LEAGUE_ID:-}"
      ADP_SCORING: "${ADP_SCORING:-ppr}"
      ADP_TEAMS: "${ADP_TEAMS:-12}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000}"
    volumes:
      # Only its own state. ADP is fetched from the public feed and cached under
      # /data, so the container has no dependency on the CLI tool's output and
      # nothing outside this directory is mounted.
      - ./data:/data
    ports:
      # Bound to loopback: the tunnel reaches it, the LAN does not.
      - "127.0.0.1:8000:8000"

  # Publishes the API at a real HTTPS hostname without opening a port on the
  # router. Needs TUNNEL_TOKEN in .env -- see README for both tunnel modes.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ngfl-drafter-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env, or run the quick-tunnel command in the README}"
    depends_on:
      - api
    profiles: ["tunnel"]
